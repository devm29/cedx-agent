services:
  tinycedx:
    build: .
    environment:
      REPLAY_LLM: "true"
      SEED_DIR: "/app/seed"
      CASE_ID: "${CASE_ID:-CEDX-82C0A1}"
      # Fixed "today" so the dev seed's STALE record stays stale on any date.
      PIPELINE_NOW: "${PIPELINE_NOW:-2026-06-26}"
    volumes:
      - ./out:/app/out

  tests:
    profiles: ["test"]
    build:
      context: .
      args:
        DEV: "true"
    environment:
      REPLAY_LLM: "true"
    command: ["sh", "-c", "make lint && make test"]
